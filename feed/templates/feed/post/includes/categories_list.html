<div class = "flex flex-col gap-3.5 items-center w-full border border-slate-700 rounded-xl px-3 pt-5 pb-3">
    <div class = "flex justify-center w-full px-2.5">
        <a class = "w-full text-center py-2.5 px-1.5 rounded-lg bg-violet-400/70 text-slate-200 font-geist font-semibold text-sm hover:bg-violet-500/70 hover:font-slate-100 hover:shadow-lg hover:shadow-violet-500/20 transition-[colors, shadow] duration-300" href = "{% url 'feed:post_create' %}">{% if request.user.is_authenticated %}Create a thread{% else %}Log in and discuss{% endif %}</a>
    </div>
    </form>
    <div class = "flex flex-col gap-2 w-full text-center">
        <a class = "flex items-center text-left py-1 px-3 rounded-xl border {% if not category %} border-violet-900 bg-violet-900/15 text-purple-400 {% else %} bg-slate-900/50  border-transparent hover:border-slate-700 hover:bg-slate-700/50 hover:text-slate-100 {% endif %} transition-[colors, shadow] duration-300" href = "{% url 'feed:home' %}">
                    <span class = "font-geist font-light">All threads</span>
            </a>
        <span class = "font-geist font-semibold text-slate-200 px-2">Main categories</span>
        <div class = "flex flex-col gap-2 w-full">
            {% for category_el in categories %}
            <a class = "flex items-center text-left text-slate-200 gap-px py-1 px-3 rounded-xl border {% if category_el == category %} border-[color-mix(in_srgb,var(--category_color)25%,#314158)] bg-[color-mix(in_srgb,var(--category_color)15%,transparent)] {% else %} bg-slate-900/50   border-transparent hover:border-[color-mix(in_srgb,var(--category_color)25%,#314158)] hover:bg-[color-mix(in_srgb,var(--category_color)15%,transparent)] hover:text-slate-100 {% endif %} transition-[colors, shadow] duration-300" href = "{% url 'feed:post_list_by_category' category_el.slug %}" style="--category_color:{{ category_el.color }};">
                    <span class = "font-geist text-sm text-[color-mix(in_srgb,var(--category_color)50%,white)]" style = "--category_color:{{ category_el.color }};">/</span>
                    <span class = "font-geist font-light">{{ category_el.name | lower }}</span>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
