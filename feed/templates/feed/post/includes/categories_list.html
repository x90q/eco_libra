<section class = "categories_list">
    {% if request.user.is_authenticated %}
    <a class = 'create_post_button' href = "{% url 'feed:post_create' %}">create topic</a>
    {% endif %}
    </form>
    <h2> categories: </h2>
    <div class = "categories_list_container">
    {% for category in categories %}
    <a href = "{% url 'feed:post_list_by_category' category.slug %}" style="--category_color:{{ category.color }};">
        <span class = "categories_list_item">
            <span class = "cat_symbol">/</span>{{ category.name | lower }}
        </span>
    </a>
    {% endfor %}
    </div>
</section>
