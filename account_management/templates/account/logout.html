{% extends 'feed/base.html' %}

{% block title %}eco_libra - sign out{% endblock %}

{% load allauth %}

{% block content %}
<div class = 'flex flex-col gap-3 w-full max-w-sm rounded-xl px-6 py-4 mx-auto border border-slate-700 mt-20 font-geist'>
    <span class = "w-full text-center font-semibold text-xl text-slate-200">Sign out</span>
    <span class = "w-full text-center text-sm text-slate-400">Are you sure want to sign out?</span>
    <form method = 'post' action = '{% url "account_logout" %}' class = 'w-full flex items-center'>
        {% csrf_token %}
        <button type = 'submit' class = 'w-full px-4 py-2 text-center rounded-xl border border-rose-950 bg-rose-950/15 text-rose-800 font-geist text-sm font-semibold cursor-pointer'>Sign out</button>
        {{ redirect_field }}
    </form>
</div>
{% endblock %}
