{% extends 'blog/base.html' %}

{% load static %}

{% block title %}eco_libra - add a comment{% endblock %}

{% block extra_js %}
<link rel="stylesheet" href="{% static "css/post_comment.css" %}">
{% endblock %}

{% block content %}
    {% if comment %}
    <div class = "successful_comment">
        <a href = '{{ post.get_absolute_url }}'>← back to the post</a>
        <h2>your comment has been successfully published.</h2>
    </div>
    {% endif %}
{% endblock %}
