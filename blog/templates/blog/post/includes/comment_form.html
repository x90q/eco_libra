<form class = "add_comment_form" action = " {% url 'blog:post_comment' post.id %}" method = "POST">
    <!--- {{ form.as_p }} -->
        <div class="add_comment_form_item">
        <label for="{{ form.name.id_for_label }}">name:</label>
        {{ form.name }}
        </div>
        <div class="add_comment_form_item">
        <label for="{{ form.email.id_for_label }}">email:</label>
        {{ form.email }}
        </div>
        <div class="add_comment_form_body">
        <label for="{{ form.body.id_for_label }}">comment:</label>
        {{ form.body }}
        </div>
    {% csrf_token %}
    <button type="submit" class="add_comment_submit_button">add comment</button>
    </form>
